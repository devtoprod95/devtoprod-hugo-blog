services:
  # 1. Hugo 블로그 서버 (개발용 Live Reload)
  hugo:
    image: hugomods/hugo:exts
    container_name: hugo-blog
    # 도커가 실행하는 유저를 로컬의 일반 사용자(g015) 권한으로 강제 고정
    user: "1000:1000"
    command: server --bind 0.0.0.0 -p 1313 --buildDrafts --watch
    volumes:
      - ./blog:/src
    ports:
      - "1313:1313"
    working_dir: /src

  # 2. Go 자동화 스크립트 실행 컨테이너
  go-app:
    build:
      context: .
      dockerfile: Dockerfile.go
    container_name: go-app
    # 동일하게 일반 사용자 권한으로 작동하도록 고정
    user: "1000:1000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TZ=Asia/Seoul