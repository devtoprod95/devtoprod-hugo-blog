name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - master # master 브랜치에 푸시될 때 작동
  schedule:
    - cron: '0 */4 * * *' # 한국 시간 기준 매 4시간마다 수집 (UTC 0시, 4시, 8시, 12시, 16시, 20시...)

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # 서브모듈이 있다면 함께 checkout
          fetch-depth: 0    # 전체 Git 히스토리 패치

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Daum Entertainment Scraper
        run: go run daum-article.go

      - name: Commit and Push Scraped Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/content/posts/
          
          # 새로 추가되거나 변경된 파일이 있는지 확인 후 커밋/푸시
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-scrape latest entertainment articles [skip ci]"
            git push origin master
          else
            echo "No new articles found. Skipping commit."
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5' # 프로젝트에 설치된 버전 호환을 위해 지정
          extended: true

      - name: Build with Hugo
        run: hugo --minify
        working-directory: blog # Hugo 프로젝트 소스가 들어있는 디렉토리 지정

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog/public # 빌드된 정적 HTML/CSS 파일들이 위치한 경로 지정
          publish_branch: gh-pages # Pages 호스팅을 위해 업로드할 대상 브랜치
          nojekyll: true # gh-pages 브랜치에 .nojekyll 파일 강제 생성
