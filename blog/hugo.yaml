baseURL: "http://localhost:1313/"
title: "AI Tech News Curation"
description: "AI & Tech 최신 뉴스 큐레이션 블로그"
copyright: ""

theme: "seotax"
defaultContentLanguage: "ko"
languageCode: "ko-kr"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
hasCJKLanguage: true

disableKinds: ["term"]

minify:
  disableXML: true
  minifyOutput: true

permalinks:
  posts: "/blog/:slugorcontentbasename/"

markup:
  goldmark:
    extensions:
      typographer:
        disable: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  author: ""
  keywords: ["Blog", "AI", "Tech", "News", "뉴스", "블로그"]

  posts:
    section: "posts"
    sort: "newest"

  search:
    enabled: true
    sort: "newest"

  assets:
    favicon: ""

  menu:
    profileImage: "/images/profile/menu.svg"
    categories: true
    recentPosts: true
    categoryOrder:
      - name: "개발"
        weight: 10
      - name: "독서"
        weight: 20
      - name: "기타"
        weight: 30

  tableOfContents:
    startLevel: 2
    endLevel: 3

  schema:
    publisherType: "Person"
